# Search strategy for PhotoDeg-Bench. Recorded verbatim in data/raw/PROVENANCE.txt on every run
# so the corpus is reproducible from these strings and the fetch date.
# [VERIFY] Boris reviews these strings before the v1.0 fetch.

contact_email: ""          # used as OpenAlex mailto (polite pool) and Europe PMC email param; set via env PHOTODEG_EMAIL instead if preferred

year_min: 2010             # [VERIFY] scope floor
year_max: null             # null = through fetch date

europepmc:
  # Europe PMC query syntax. OPEN_ACCESS:y restricts to articles with OA full text.
  queries:
    - '(ABSTRACT:"visible light" OR ABSTRACT:"visible-light" OR ABSTRACT:"blue light" OR ABSTRACT:"LED") AND (ABSTRACT:"depolymerization" OR ABSTRACT:"depolymerisation" OR ABSTRACT:"polymer degradation" OR ABSTRACT:"polymer deconstruction" OR ABSTRACT:"chain scission" OR ABSTRACT:"plastic upcycling") AND OPEN_ACCESS:y'
    - '(ABSTRACT:"photocatalytic" OR ABSTRACT:"photocatalysis" OR ABSTRACT:"photoredox" OR ABSTRACT:"photooxidative") AND (ABSTRACT:"polystyrene" OR ABSTRACT:"polyethylene" OR ABSTRACT:"polypropylene" OR ABSTRACT:"poly(methyl methacrylate)" OR ABSTRACT:"PMMA" OR ABSTRACT:"polyacrylate" OR ABSTRACT:"polyester" OR ABSTRACT:"polyvinyl chloride") AND (ABSTRACT:"degradation" OR ABSTRACT:"depolymerization" OR ABSTRACT:"upcycling") AND OPEN_ACCESS:y'
  page_size: 1000

openalex:
  # OpenAlex full-text-ish search over title/abstract. Filter keeps OA works only.
  searches:
    - 'visible light depolymerization'
    - 'visible light polymer degradation photocatalyst'
    - 'photocatalytic upcycling polystyrene'
    - 'photocatalytic plastic upcycling'
    - 'photoredox chain scission polymer'
    - 'light-driven depolymerization'
  filter: 'is_oa:true,type:article'
  per_page: 200

screening:
  # Title/abstract screen applied after fetch. A paper is kept as a candidate if it matches
  # at least one term from each group. Final inclusion is Boris's call in data/curated/screening.csv.
  light_terms: ['visible', 'blue light', 'led', 'nm', 'sunlight', 'photocatal', 'photoredox', 'photochem', 'light-driven', 'light driven']
  polymer_terms: ['polymer', 'polystyrene', 'polyethylene', 'polypropylene', 'pmma', 'methacrylate', 'acrylate', 'polyester', 'plastic', 'pvc', 'polyvinyl', 'pet ', 'polylactic', 'pla ']
  outcome_terms: ['degradation', 'depolymeri', 'deconstruct', 'scission', 'upcycl', 'recycl', 'oxidation']
