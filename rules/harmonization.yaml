# PhotoDeg-Bench harmonization rules, v1.0
#
# Decided by: Claude (AI) as Agent E, 2026-10-12, under the author's delegation of
# ordinary scientific processing decisions. Each rule records its rationale and the records for
# which it is invalid. Rules marked `escalate: true` are genuinely the author's call; they carry a
# conservative provisional decision so the pipeline can run, and the release-readiness report lists
# them as awaiting endorsement.
#
# General principle: preserve every reported value; harmonize only what can be harmonized without
# assumptions; never merge different endpoints; label comparability instead of forcing it.

version: "1.0"
author: "Claude (AI), Agent E; author endorsement pending"
last_reviewed: "2026-10-12"

rules:

  R01_canonical_mass_unit:
    required: true
    status: set
    options: [kg/mol, g/mol]
    decision: kg/mol
    rationale: >-
      Most records report kDa or kg/mol; kg/mol keeps harmonized numbers in a readable range. Pure unit
      conversion (Da = g/mol; kDa = kg/mol), no change of meaning. As-reported values and units are kept.
    invalid_for: "none (unit conversion only)"

  R02_primary_average:
    required: true
    status: set
    options: [Mn_only, Mn_then_Mw, Mw_only, Mp_only]
    decision: Mn_then_Mw
    rationale: >-
      Mn is the average most directly tied to chain number and is the one most often reported before and
      after. Where a paper reports only Mw at both points, Mw is used. The average is never mixed within a
      pair (Mn before is never compared with Mw after), and primary_average names which was used, so Mn-
      and Mw-based retained fractions can be separated by users.
    invalid_for: "records with only one time point of molar mass (no metric computed)"

  R03_calibration_policy:
    required: true
    status: set
    options: [keep_as_reported_flag, universal_conversion, exclude_mismatched]
    decision: keep_as_reported_flag
    rationale: >-
      Universal calibration (ISO 16014-2) needs validated Mark-Houwink K and a for both standard and analyte
      in the same eluent at the same temperature, and for degraded, end-functionalized oligomers those
      constants are not established. Converting would add an unverifiable assumption to every record. Values
      are therefore kept as reported and labelled by calibration class (R05). Within a record, before and
      after are measured on the same instrument and calibration, so the retained fraction is largely
      insensitive to a constant calibration bias; comparisons ACROSS polymers or calibrations remain approximate.
    invalid_for: "absolute comparison of molar masses across papers with different calibrations"

  R04_mark_houwink_constants:
    required: false
    status: set
    table: []
    rationale: "Not used (R03 does not convert)."

  R05_calibration_type_map:
    required: true
    status: set
    decision:
      conventional_PS: {matched_if_polymer: polystyrene, matched: matched_conventional, otherwise: mismatched_conventional}
      conventional_PMMA: {matched_if_polymer: "poly(methyl methacrylate)", matched: matched_conventional, otherwise: mismatched_conventional}
      conventional_PEG_PEO: {matched_if_polymer: "PEG/PEO", matched: matched_conventional, otherwise: mismatched_conventional}
      universal_calibration: absolute
      absolute_MALS: absolute
      triple_detection: absolute
      high_temperature_SEC: unknown
      MALDI_TOF: other_method
      DOSY_NMR: other_method
      other: unknown
      not_reported: unknown
    rationale: >-
      Conventional calibration is exact only for the polymer of the standards; for other polymers it gives
      'polystyrene-equivalent' (or PMMA-equivalent) masses. Light scattering, universal calibration and
      triple detection give absolute values in principle. When the paper does not state the calibration the
      class is unknown rather than guessed.
    invalid_for: "copolymers named poly(A-co-B) are classed by exact polymer-name match, so PMMA copolymers on PS standards are mismatched"

  R06_deconstruction_metrics:
    required: true
    status: set
    options: [retained_fraction, scissions_per_chain, percent_reduction]
    decision: [retained_fraction, percent_reduction]
    primary: retained_fraction
    rationale: >-
      retained_fraction = M_after / M_before (same average, same record). Scissions per chain
      (Mn0/Mn - 1) is NOT reported: it assumes random main-chain scission, while several systems here
      depolymerize by chain-end unzipping (ATRP/RAFT-derived polymethacrylates), where falling Mn reflects
      monomer loss, not scission count. Reporting it would invite a misleading cross-mechanism comparison.
      Product yields are a separate endpoint and are never combined with molar-mass metrics.
    invalid_for: "records without a before/after pair"

  R07_same_basis_requirement:
    required: true
    status: set
    options: [same_average_same_calibration, same_average_any_calibration]
    decision: same_average_same_calibration
    rationale: "Before and after must be the same average from the same SEC method, which holds within every record."

  R08_visible_window:
    required: true
    status: set
    lower_nm: 380
    upper_nm: 780
    broadband_sources: include_flagged
    sunlight_or_solar_sim: include_flagged
    uv_component_present: include_flagged
    escalate: true
    rationale: >-
      380-780 nm is the CIE colorimetric visible range (ISO/CIE 11664). Broadband sources (white LEDs, Xe
      lamps, solar simulators, sunlight) contain visible light and some contain UV; they are kept and
      flagged so users can exclude them. Narrow-band sources centred at 380-400 nm are visible by this
      definition but sit at the violet edge. Provisional and escalated: whether unfiltered Xe/solar runs and
      heated (>=80 C) photothermally assisted runs belong in a 'visible-light' benchmark is the author's call.
    invalid_for: "records whose light emission is only described by colour or 'visible light'"

  R09_wavelength_bands:
    required: true
    status: set
    bands:
      - {name: violet, lower_nm: 380, upper_nm: 450}
      - {name: blue, lower_nm: 450, upper_nm: 495}
      - {name: green, lower_nm: 495, upper_nm: 570}
      - {name: yellow_orange_red, lower_nm: 570, upper_nm: 781}
    color_only_reports: map_by_name
    rationale: >-
      Conventional spectral colour boundaries. When only a colour is reported (e.g. 'blue LEDs') the band is
      taken from the colour name; white/solar/Xe sources are labelled 'broadband'.
    invalid_for: "none"

  R10_time_unit:
    required: true
    status: set
    options: [h, min]
    decision: h
    rationale: "Hours cover the range of reported times (minutes to days) without large exponents."

  R11_comparability_tiers:
    required: true
    status: set
    tiers_molar_mass:
      - {name: MM-A, calibration_class_in: [absolute, matched_conventional], require: [has_primary_before_after, has_time, has_wavelength]}
      - {name: MM-B, require: [has_primary_before_after, has_time, has_wavelength]}
      - {name: MM-C, require: [has_primary_before_after]}
    tiers_product_yield:
      - {name: PY-A, require: [has_yield, has_time, has_wavelength, has_yield_basis]}
      - {name: PY-B, require: [has_yield, has_time]}
      - {name: PY-C, require: [has_yield]}
    rationale: >-
      Two independent tier ladders, one per endpoint, because molar-mass retention and product yield
      measure different things. A = enough reported to compare like with like; B = comparable with care
      (calibration mismatched/unknown, or yield basis not stated); C = reported value without the context
      needed for comparison. Irradiance is not required because few papers report it at the sample.
    invalid_for: "tiers describe reporting completeness, not data quality"

  R12_product_yield_basis:
    required: true
    status: set
    options: [keep_reported_basis, convert_to_wt_percent]
    decision: keep_reported_basis
    rationale: "Yields are kept with the basis the paper gives (mol% per repeat unit, isolated, NMR, GC, mass). Conversion would need repeat-unit masses and product purities not reported uniformly."

  R13_controls_and_negatives:
    required: true
    status: set
    options: [include_as_controls, exclude]
    decision: include_as_controls
    rationale: "Dark, catalyst-free and anaerobic controls show whether light and catalyst are needed; they are released with is_control = y and excluded from rankings and figures of performance."

  R14_source_license_policy:
    required: true
    status: set
    allowed: [cc-by, cc-by-sa, cc0, cc-by-nc, cc-by-nc-sa, cc-by-nc-nd]
    unknown_license: exclude
    escalate: true
    rationale: >-
      Released records contain reported numerical values, condition labels and locators, plus short source
      strings in evidence.csv; no article text is redistributed. Records from NC/ND-licensed articles are
      kept and their license is recorded per row. Provisional and escalated: whether to keep NC/ND-sourced
      records (or the source strings from them) in a CC BY 4.0 dataset is a legal judgment for the author;
      switching to [cc-by, cc-by-sa, cc0] removes them in one edit.
    invalid_for: "none"

  R15_thermal_regime:
    required: true
    status: set
    decision: {ambient_max_c: 60, heated_max_c: 120}
    rationale: >-
      Several systems run at 100-170 C, and in at least one a dark control at the same temperature gives
      most of the lit result. Records are labelled near_ambient (<60 C, including LED self-heating to ~50 C), heated
      (60-120 C) or high_temperature (>120 C) so photochemical and photothermally assisted results are not
      ranked together unintentionally.
    invalid_for: "records without a stated temperature (labelled 'not_reported')"
